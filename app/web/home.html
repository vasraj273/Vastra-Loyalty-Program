<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loyalty — YourApp</title>
<meta name="theme-color" content="#0191d0" />
<style>
  :root {
    --paper:#edf3f8; --card:#ffffff; --ink:#112134; --soft:#45576b;
    --line:#d2dee9; --primary:#0191d0; --primary-deep:#0379ae;
    --indigo:#1d466f; --madder:#fb624b; --leaf:#3e6b4f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink);
         display:flex; justify-content:center; min-height:100vh; }
  .wrap { width:100%; max-width:430px; padding:30px 18px 40px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .brand-logo { height:46px; width:auto; display:block; }
  h1 { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:23px; margin:0; }
  .sub { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--madder); font-weight:600; margin:2px 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px;
          box-shadow:0 1px 2px rgba(34,41,79,.08),0 8px 24px rgba(34,41,79,.07); margin-bottom:14px; }
  label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--soft); margin:12px 0 5px; }
  input { width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input:focus { outline:2px solid var(--indigo); outline-offset:-1px; }
  button { width:100%; font:inherit; font-weight:600; font-size:15px; padding:14px; margin-top:14px; border:none; border-radius:10px;
           background:var(--primary); color:#fff; cursor:pointer; box-shadow:2px 2px 0 var(--indigo); }
  button:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--indigo); }
  button.secondary { background:var(--indigo); box-shadow:2px 2px 0 var(--madder); }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .error { background:#fee9e5; border:1px solid var(--madder); color:#e34a33; padding:10px 13px; border-radius:8px; margin-top:12px; font-size:14px; display:none; }
  .hidden { display:none; }
  .points-card { background:linear-gradient(155deg,var(--primary) 0%,var(--indigo) 100%); border:none; color:#fff;
                 padding:30px 22px 32px; text-align:center; box-shadow:0 10px 28px rgba(29,70,111,.28); }
  .points-card .who { font-size:14px; color:rgba(255,255,255,.8); margin:0 0 24px; }
  .points-card .who strong { color:#fff; font-weight:600; }
  .points-card .who span:not(:empty)::before { content:" · "; }
  .wallet .label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.75); font-weight:600; }
  .wallet .bal { font-weight:700; font-size:62px; line-height:1.05; color:#fff; margin-top:8px; letter-spacing:-1px; }
  .scan-cta { display:flex; align-items:center; gap:14px; width:100%; margin:0; padding:20px 22px; text-align:left;
              font-size:18px; border-radius:14px; background:var(--card); color:var(--ink); border:1px solid var(--line);
              box-shadow:0 1px 2px rgba(34,41,79,.08),0 8px 24px rgba(34,41,79,.07); }
  .scan-cta .ic { flex:none; width:52px; height:52px; border-radius:14px; background:rgba(1,145,208,.12);
                  display:flex; align-items:center; justify-content:center; font-size:26px; }
  .scan-cta .t { display:block; font-weight:700; font-size:18px; }
  .scan-cta .s { display:block; font-weight:400; font-size:13px; color:var(--soft); margin-top:2px; }
  .scan-cta .arw { margin-left:auto; font-size:22px; color:var(--primary); }
  .scan-cta:active { transform:translateY(1px); }
  .appbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .navmenu { position:relative; flex:none; }
  .menu-btn { width:auto; margin:0; padding:10px; background:transparent; box-shadow:none; border:1px solid var(--line);
              border-radius:9px; display:inline-flex; flex-direction:column; gap:4px; cursor:pointer; }
  .menu-btn:active { transform:none; box-shadow:none; }
  .menu-btn i { display:block; width:22px; height:2px; background:var(--indigo); border-radius:2px; transition:transform .2s,opacity .2s; }
  .menu-btn.open i:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .menu-btn.open i:nth-child(2){ opacity:0; }
  .menu-btn.open i:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
  .menu-pop { position:absolute; right:0; top:calc(100% + 8px); min-width:210px; background:var(--card);
              border:1px solid var(--line); border-radius:12px; padding:8px; z-index:60;
              box-shadow:0 16px 40px rgba(34,41,79,.22); display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { width:100%; margin:0; text-align:left; font-size:15px; font-weight:500; padding:11px 14px;
                     border:none; background:transparent; color:var(--ink); box-shadow:none; border-radius:8px; cursor:pointer; }
  .menu-pop button:active { transform:none; box-shadow:none; }
  .menu-pop button.active { color:var(--primary-deep); font-weight:600; background:rgba(1,145,208,.10); }
  .menu-pop button.logout { color:var(--madder); margin-top:0; }
  .menu-pop .sep { height:1px; background:var(--line); margin:6px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="brand">
      <img class="brand-logo" src="/web/vastra-logo.png" alt="Vastra" />
      <div><h1>Loyalty Rewards</h1><div class="sub" style="margin:0">Retailer · YourApp</div></div>
    </div>
    <div class="navmenu hidden" id="navWrap">
      <button class="menu-btn" id="navBtn" onclick="toggleMenu()" aria-label="Menu" aria-haspopup="menu"><i></i><i></i><i></i></button>
      <div class="menu-pop" id="navPop" role="menu">
        <button class="active" onclick="go('/web')">Home</button>
        <button onclick="go('/web/shop')">Redeem shop</button>
        <button onclick="go('/web/claims')">Claims</button>
        <div class="sep"></div>
        <button class="logout" onclick="logout()">Log out</button>
      </div>
    </div>
  </div>

  <!-- login -->
  <div class="card hidden" id="loginCard">
    <label>Username</label>
    <input id="username" autocomplete="username" placeholder="your shop login" />
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button onclick="login()">Log in</button>
    <div class="error" id="loginError"></div>
  </div>

  <!-- password change required -->
  <div class="card hidden" id="pwChangeCard">
    <h3 style="margin-top:0; color:var(--madder);">Security Update Required</h3>
    <p class="sub" style="text-transform:none; letter-spacing:normal; color:var(--soft); margin-bottom:12px;">
      For security reasons, you must set a new password before accessing your account.
    </p>
    <label>Current Password</label>
    <input id="curPassword" type="password" placeholder="e.g. shopname123" />
    <label>New Password (min 8 chars)</label>
    <input id="newPassword" type="password" placeholder="Enter new password" />
    <label>Confirm New Password</label>
    <input id="confirmPassword" type="password" placeholder="Re-enter new password" />
    <button onclick="submitPasswordChange()">Set New Password & Continue</button>
    <div class="error" id="pwChangeError"></div>
  </div>

  <!-- dashboard -->
  <div class="hidden" id="dash">
    <div class="card points-card">
      <p class="who"><strong id="whoShop"></strong><span id="whoManuf"></span></p>
      <div class="wallet">
        <div class="label">Total points</div>
        <div class="bal" id="bal">—</div>
      </div>
    </div>
    <button class="scan-cta" onclick="go('/web/scan')">
      <span class="ic">📷</span>
      <span><span class="t">Scan QR code</span><span class="s">Scan a sticker to earn points</span></span>
      <span class="arw">→</span>
    </button>
  </div>
</div>

<script>
let token = localStorage.getItem('vl_rtoken') || '';
const $ = (id) => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);
const err = (m) => { const e = $('loginError'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; };

// A scanned QR deep link arrives as ?next=/web/scan/<token>. Capture it in
// memory, then clean the address bar so the long code isn't shown on the login
// screen — the redirect target is preserved and still used after login.
const nextDest = (() => {
  const n = new URLSearchParams(location.search).get('next');
  if (n) history.replaceState({}, '', '/web');
  return (n && n.startsWith('/web')) ? n : null;
})();

function toggleMenu() {
  $('navPop').classList.toggle('open');
  $('navBtn').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const pop = $('navPop'), btn = $('navBtn');
  if (!pop || !pop.classList.contains('open')) return;
  if (!pop.contains(e.target) && !btn.contains(e.target)) {
    pop.classList.remove('open'); btn.classList.remove('open');
  }
});

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers);
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, opts);
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) { token = ''; localStorage.removeItem('vl_rtoken'); render(); }
    throw new Error((body && body.detail) || res.statusText);
  }
  return body;
}

async function login() {
  err('');
  try {
    const out = await api('/auth/retailer/login', { method: 'POST', body: JSON.stringify({
      username: $('username').value.trim(), password: $('password').value }) });
    token = out.token;
    localStorage.setItem('vl_rtoken', token);
    if (out.must_change) {
      render();
      return;
    }
    if (nextDest) { window.location.href = nextDest; return; }
    render();
  } catch (e) { err(e.message); }
}

async function submitPasswordChange() {
  const pwErr = (m) => { const e = $('pwChangeError'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; };
  pwErr('');
  const curP = $('curPassword').value;
  const newP = $('newPassword').value;
  const confP = $('confirmPassword').value;
  if (!curP) { pwErr('Please enter your current password'); return; }
  if (newP.length < 8) { pwErr('New password must be at least 8 characters'); return; }
  if (newP !== confP) { pwErr('Passwords do not match'); return; }
  try {
    await api('/retailer/password', {
      method: 'POST',
      body: JSON.stringify({ current_password: curP, new_password: newP })
    });
    if (nextDest) { window.location.href = nextDest; return; }
    render();
  } catch (e) {
    pwErr(e.message);
  }
}

async function logout() {
  try { await api('/auth/retailer/logout', { method: 'POST' }); } catch {}
  token = ''; localStorage.removeItem('vl_rtoken'); sessionStorage.removeItem('vl_scan_loc'); render();
}

function go(path) { window.location.href = path; }

async function render() {
  if (!token) { show('loginCard', true); show('dash', false); show('navWrap', false); show('pwChangeCard', false); return; }
  try {
    const me = await api('/retailer/me');
    if (me.must_change) {
      show('loginCard', false);
      show('dash', false);
      show('navWrap', false);
      show('pwChangeCard', true);
      return;
    }
    show('pwChangeCard', false);
    $('whoShop').textContent = me.shop_name;
    $('whoManuf').textContent = me.manufacturer || '';
    $('bal').textContent = Number(me.balance).toLocaleString('en-IN');
    show('loginCard', false); show('dash', true); show('navWrap', true);
  } catch { show('loginCard', true); show('dash', false); show('navWrap', false); show('pwChangeCard', false); }
}
render();
</script>
</body>
</html>
