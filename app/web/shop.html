<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rewards Shop</title>
<meta name="theme-color" content="#0191d0" />
<style>
  :root {
    --paper:#edf3f8; --card:#ffffff; --ink:#112134; --soft:#45576b;
    --line:#d2dee9; --primary:#0191d0; --primary-deep:#0379ae;
    --indigo:#1d466f; --madder:#fb624b; --leaf:#3e6b4f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink); }
  .topbar { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:3px double var(--ink);
            padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-logo { height:40px; width:auto; display:block; }
  .brand h1 { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:18px; margin:0; }
  .brand .sub { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--madder); font-weight:600; }
  .wallet { text-align:right; }
  .wallet .label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); }
  .wallet .bal { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:24px; line-height:1; color:var(--indigo); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px 18px 50px; }
  .ok { background:rgba(62,107,79,.12); border:1px solid rgba(62,107,79,.4); color:var(--leaf); padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .error { background:#fee9e5; border:1px solid var(--madder); color:#e34a33; padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .gift { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
          display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(34,41,79,.07),0 8px 22px rgba(34,41,79,.06); position:relative; }
  .gift.locked { opacity:.62; }
  .badge { position:absolute; top:12px; left:12px; background:var(--primary); color:#fff; border-radius:6px;
           padding:5px 9px; line-height:1.05; box-shadow:2px 2px 0 rgba(34,41,79,.25); }
  .badge .pts { font-weight:700; font-size:15px; }
  .badge .lbl { display:block; font-size:8px; letter-spacing:1.5px; font-weight:600; }
  .thumb { height:170px; background:#fff; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb .ph { font-size:46px; }
  .body { padding:14px 15px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:16px; font-weight:600; margin:0; text-transform:uppercase; letter-spacing:.3px; }
  .desc { font-size:12px; color:var(--soft); margin:0; flex:1; }
  button.claim { font:inherit; font-weight:600; font-size:14px; padding:10px; border:none; border-radius:8px;
          background:var(--madder); color:var(--paper); cursor:pointer; box-shadow:2px 2px 0 var(--indigo); margin-top:6px; }
  button.claim:disabled { background:#c5d2dd; color:#6a7888; box-shadow:none; cursor:default; }
  button.claim:active:not(:disabled) { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--indigo); }
  .empty { color:var(--soft); font-style:italic; }
  .links { margin-top:20px; font-size:13px; }
  .links a { color:var(--madder); cursor:pointer; }

  .topbar-right { display:flex; align-items:center; gap:14px; }
  .navmenu { position:relative; flex:none; }
  .menu-btn { width:auto; margin:0; padding:9px; background:transparent; box-shadow:none; border:1px solid var(--line);
              border-radius:9px; display:inline-flex; flex-direction:column; gap:4px; cursor:pointer; }
  .menu-btn:active { transform:none; box-shadow:none; }
  .menu-btn i { display:block; width:22px; height:2px; background:var(--indigo); border-radius:2px; transition:transform .2s,opacity .2s; }
  .menu-btn.open i:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .menu-btn.open i:nth-child(2){ opacity:0; }
  .menu-btn.open i:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
  .menu-pop { position:absolute; right:0; top:calc(100% + 8px); min-width:210px; background:var(--card);
              border:1px solid var(--line); border-radius:12px; padding:8px; z-index:60;
              box-shadow:0 16px 40px rgba(34,41,79,.22); display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { width:100%; margin:0; text-align:left; font-size:15px; font-weight:500; padding:11px 14px;
                     border:none; background:transparent; color:var(--ink); box-shadow:none; border-radius:8px; cursor:pointer; }
  .menu-pop button:active { transform:none; box-shadow:none; }
  .menu-pop button.active { color:var(--primary-deep); font-weight:600; background:rgba(1,145,208,.10); }
  .menu-pop button.logout { color:var(--madder); }
  .menu-pop .sep { height:1px; background:var(--line); margin:6px 8px; }
  .backdrop { position:fixed; inset:0; background:rgba(26,0,85,.48); display:flex;
              align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:28px 24px 22px; width:100%; max-width:380px; text-align:center;
           box-shadow:0 20px 60px rgba(34,41,79,.3); }
  .modal .tick { width:62px; height:62px; border-radius:50%; background:var(--leaf); color:#fff;
                 font-size:34px; line-height:62px; margin:0 auto 12px; }
  .modal h2 { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:22px; margin:0 0 4px; color:var(--leaf); }
  .modal p { margin:4px 0; font-size:14px; color:var(--soft); }
  .modal .gift-name { color:var(--ink); font-weight:600; }
  .id-box { margin:16px 0 6px; border:1px dashed var(--line); border-radius:10px; padding:12px;
            background:var(--paper); }
  .id-box .lbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); }
  .id-box .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:26px; color:var(--indigo); margin-top:3px; }
  .id-box .hint { font-size:11px; color:var(--soft); margin-top:4px; }
  .modal button { width:100%; margin-top:10px; }
  .modal .copy { background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; padding:9px; font-size:13px; }
  .modal.confirm { text-align:left; }
  .modal.confirm h2 { color:var(--ink); }
  .modal.confirm p { color:var(--soft); font-size:14px; line-height:1.5; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(17,33,52,.5); backdrop-filter:blur(3px); z-index:100;
                    display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:380px;
                 text-align:left; box-shadow:0 20px 45px rgba(34,41,79,.25); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/web/vastra-logo.png" alt="Vastra" />
      <div><h1 id="shopTitle">Rewards Shop</h1><div class="sub">Loyalty rewards</div></div>
    </div>
    <div class="topbar-right">
      <div class="wallet"><div class="label">Your points</div><div class="bal" id="bal">—</div></div>
      <div class="navmenu">
        <button class="menu-btn" id="navBtn" onclick="toggleMenu()" aria-label="Menu" aria-haspopup="menu"><i></i><i></i><i></i></button>
        <div class="menu-pop" id="navPop" role="menu">
          <button onclick="go('/web')">Home</button>
          <button class="active" onclick="go('/web/shop')">Redeem shop</button>
          <button onclick="go('/web/claims')">Claims</button>
          <div class="sep"></div>
          <button onclick="openChangePwModal()">Change password</button>
          <button class="logout" onclick="menuLogout()">Log out</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="ok" id="ok"></div>
    <div class="error" id="err"></div>
    <div class="grid" id="gifts"></div>
    <div class="links"><a onclick="go('/web')">← Home</a> &nbsp;·&nbsp; <a onclick="go('/web/claims')">My claims</a> &nbsp;·&nbsp; <a onclick="go('/web/scan')">Scan a code</a></div>
  </div>

  <div class="backdrop" id="successModal" style="display:none">
    <div class="modal">
      <div class="tick">✓</div>
      <h2>Claim Successful!</h2>
      <p>You claimed <span class="gift-name" id="mGift"></span>.</p>
      <div class="id-box">
        <div class="lbl">Your Claim ID</div>
        <div class="ref" id="mRef"></div>
        <div class="hint">Keep this as proof of your claim</div>
      </div>
      <p id="mBal"></p>
      <button class="copy" onclick="copyRef(this)">Copy Claim ID</button>
      <button onclick="go('/web/claims')">View my claims</button>
      <button class="copy" onclick="closeModal()">Done</button>
    </div>
  </div>

  <div class="backdrop" id="confirmModal" style="display:none">
    <div class="modal confirm">
      <h2 id="cfTitle">Confirm</h2>
      <p id="cfMsg"></p>
      <button class="claim" id="cfYes">Confirm</button>
      <button class="copy" id="cfNo">Cancel</button>
    </div>
  </div>

  <!-- change password modal (from burger menu) -->
  <div class="modal-backdrop hidden" id="changePwModal">
    <div class="modal-card">
      <h3 style="margin-top:0; margin-bottom:6px; font-size:18px; color:var(--ink);">Change Password</h3>
      <p style="font-size:13px; color:var(--soft); margin-top:0; margin-bottom:14px;">Update your password for your retailer account.</p>
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">Current Password</label>
      <input id="modalCurPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px;" placeholder="Current password" />
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">New Password (min 8 chars)</label>
      <input id="modalNewPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px;" placeholder="New password" />
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">Confirm New Password</label>
      <input id="modalConfirmPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px;" placeholder="Re-enter new password" />
      <button class="claim" onclick="submitModalPwChange()" style="margin-top:0; width:100%;">Update Password</button>
      <button class="copy" onclick="closeChangePwModal()" style="margin-top:8px; width:100%;">Cancel</button>
      <div class="error" id="modalPwError" style="margin-top:10px; display:none;"></div>
      <div id="modalPwSuccess" style="margin-top:10px; padding:10px; background:#e6f4ea; color:#137333; border:1px solid #ceead6; border-radius:8px; font-size:13px; display:none;">Password updated successfully!</div>
    </div>
  </div>

<script>
let token = localStorage.getItem('vl_rtoken') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n) => Number(n).toLocaleString('en-IN');
function flash(id, msg) { const e = $(id); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
function go(p) { window.location.href = p; }
function gotoLogin() { window.location.href = '/web?next=' + encodeURIComponent('/web/shop'); }

function toggleMenu() {
  $('navPop').classList.toggle('open');
  $('navBtn').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const pop = $('navPop'), btn = $('navBtn');
  if (!pop || !pop.classList.contains('open')) return;
  if (!pop.contains(e.target) && !btn.contains(e.target)) {
    pop.classList.remove('open'); btn.classList.remove('open');
  }
});
async function menuLogout() {
  try { await fetch('/auth/retailer/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch {}
  localStorage.removeItem('vl_rtoken'); sessionStorage.removeItem('vl_scan_loc');
  window.location.href = '/web';
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers);
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, opts);
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) { localStorage.removeItem('vl_rtoken'); gotoLogin(); }
    throw new Error((body && body.detail) || res.statusText);
  }
  return body;
}

async function loadShop() {
  flash('err', ''); flash('ok', '');
  try {
    const shop = await api('/retailer/shop');
    $('bal').textContent = nf(shop.balance);
    $('shopTitle').textContent = shop.shop_name + ' — Rewards';
    if (shop.gifts.length === 0) { $('gifts').innerHTML = '<p class="empty">No rewards available yet.</p>'; return; }
    $('gifts').innerHTML = shop.gifts.map(g => `
      <div class="gift ${g.affordable ? '' : 'locked'}">
        <div class="badge"><span class="pts">${nf(g.points_cost)}</span><span class="lbl">POINTS</span></div>
        <div class="thumb">
          ${g.image_url
            ? `<img src="${esc(g.image_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🎁'}))" />`
            : `<div class="ph">🎁</div>`}
        </div>
        <div class="body">
          <h3 class="name">${esc(g.name)}</h3>
          <p class="desc">${g.description ? esc(g.description) : ''}</p>
          <button class="claim" ${g.affordable ? '' : 'disabled'}
            onclick="claim(${g.id}, ${JSON.stringify(g.name).replace(/"/g, '&quot;')}, ${g.points_cost})">
            ${g.affordable ? 'Claim reward' : `Need ${nf(g.points_cost - shop.balance)} more`}
          </button>
        </div>
      </div>`).join('');
  } catch (e) { flash('err', e.message); }
}

function confirmDialog(title, message, confirmLabel) {
  return new Promise((resolve) => {
    $('cfTitle').textContent = title;
    $('cfMsg').textContent = message;
    $('cfYes').textContent = confirmLabel || 'Confirm';
    const bd = $('confirmModal');
    bd.style.display = 'flex';
    const done = (v) => {
      bd.style.display = 'none';
      $('cfYes').onclick = null; $('cfNo').onclick = null; bd.onclick = null;
      resolve(v);
    };
    $('cfYes').onclick = () => done(true);
    $('cfNo').onclick = () => done(false);
    bd.onclick = (e) => { if (e.target === bd) done(false); };
  });
}

async function claim(giftId, name, cost) {
  const ok = await confirmDialog(
    'Claim this reward?',
    `Claim "${name}" for ${nf(cost)} points? This is final — the points are deducted now and the request is sent to the manufacturer for approval.`,
    'Claim reward');
  if (!ok) return;
  flash('err', ''); flash('ok', '');
  try {
    const out = await api('/retailer/claim', { method: 'POST', body: JSON.stringify({ gift_id: giftId }) });
    $('mGift').textContent = out.gift;
    $('mRef').textContent = out.reference;
    $('mBal').textContent = `Sent to the manufacturer for approval. New balance: ${nf(out.new_balance)} points.`;
    $('successModal').style.display = 'flex';
    loadShop();
  } catch (e) { flash('err', e.message); }
}
function openChangePwModal() {
  $('navPop').classList.remove('open');
  $('navBtn').classList.remove('open');
  $('modalCurPw').value = '';
  $('modalNewPw').value = '';
  $('modalConfirmPw').value = '';
  $('modalPwError').style.display = 'none';
  $('modalPwSuccess').style.display = 'none';
  $('changePwModal').classList.remove('hidden');
}
function closeChangePwModal() {
  $('changePwModal').classList.add('hidden');
}
async function submitModalPwChange() {
  const errEl = $('modalPwError');
  const succEl = $('modalPwSuccess');
  errEl.style.display = 'none';
  succEl.style.display = 'none';
  const curP = $('modalCurPw').value;
  const newP = $('modalNewPw').value;
  const confP = $('modalConfirmPw').value;
  if (!curP) { errEl.textContent = 'Please enter your current password'; errEl.style.display = 'block'; return; }
  if (newP.length < 8) { errEl.textContent = 'New password must be at least 8 characters'; errEl.style.display = 'block'; return; }
  if (newP !== confP) { errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return; }
  try {
    await api('/retailer/password', {
      method: 'POST',
      body: JSON.stringify({ current_password: curP, new_password: newP })
    });
    succEl.style.display = 'block';
    setTimeout(() => closeChangePwModal(), 1500);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function copyRef(btn) {
  const ref = $('mRef').textContent;
  navigator.clipboard?.writeText(ref).then(
    () => { const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = t; }, 1500); },
    () => {});
}
function closeModal() { $('successModal').style.display = 'none'; }

if (!token) gotoLogin(); else loadShop();
</script>
</body>
</html>
