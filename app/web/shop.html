<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rewards Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#f6f1e6; --card:#fbf8f1; --ink:#22294f; --soft:#4c5170;
    --line:#ddd2bb; --indigo:#2b3468; --madder:#c8472b; --leaf:#3e6b4f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'IBM Plex Sans',sans-serif; background:var(--paper); color:var(--ink); }
  .topbar { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:3px double var(--ink);
            padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-mark { font-family:'Fraunces',serif; font-size:20px; color:var(--paper); background:var(--indigo);
                padding:6px 8px 8px; border-radius:3px 10px 3px 10px; box-shadow:2px 2px 0 var(--madder); }
  .brand h1 { font-family:'Fraunces',serif; font-size:18px; margin:0; }
  .brand .sub { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--madder); font-weight:600; }
  .wallet { text-align:right; }
  .wallet .label { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); }
  .wallet .bal { font-family:'Fraunces',serif; font-size:24px; line-height:1; color:var(--indigo); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px 18px 50px; }
  .ok { background:rgba(62,107,79,.12); border:1px solid rgba(62,107,79,.4); color:var(--leaf); padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .error { background:#f7e3dd; border:1px solid var(--madder); color:#a83a22; padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; }
  .gift { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
          display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(34,41,79,.07),0 8px 22px rgba(34,41,79,.06); position:relative; }
  .gift.locked { opacity:.62; }
  .badge { position:absolute; top:12px; left:12px; background:var(--madder); color:#fff; border-radius:6px;
           padding:5px 9px; line-height:1.05; box-shadow:2px 2px 0 rgba(34,41,79,.25); }
  .badge .pts { font-weight:700; font-size:15px; }
  .badge .lbl { display:block; font-size:8px; letter-spacing:1.5px; font-weight:600; }
  .thumb { height:170px; background:#fff; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb .ph { font-size:46px; }
  .body { padding:14px 15px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0; text-transform:uppercase; letter-spacing:.3px; }
  .desc { font-size:12px; color:var(--soft); margin:0; flex:1; }
  button.claim { font:inherit; font-weight:600; font-size:14px; padding:10px; border:none; border-radius:8px;
          background:var(--madder); color:var(--paper); cursor:pointer; box-shadow:2px 2px 0 var(--indigo); margin-top:6px; }
  button.claim:disabled { background:#cdbfa0; color:#7c715c; box-shadow:none; cursor:default; }
  button.claim:active:not(:disabled) { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--indigo); }
  .empty { color:var(--soft); font-style:italic; }
  .links { margin-top:20px; font-size:13px; }
  .links a { color:var(--madder); cursor:pointer; }

  .backdrop { position:fixed; inset:0; background:rgba(34,41,79,.5); display:flex;
              align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:28px 24px 22px; width:100%; max-width:380px; text-align:center;
           box-shadow:0 20px 60px rgba(34,41,79,.3); }
  .modal .tick { width:62px; height:62px; border-radius:50%; background:var(--leaf); color:#fff;
                 font-size:34px; line-height:62px; margin:0 auto 12px; }
  .modal h2 { font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; color:var(--leaf); }
  .modal p { margin:4px 0; font-size:14px; color:var(--soft); }
  .modal .gift-name { color:var(--ink); font-weight:600; }
  .id-box { margin:16px 0 6px; border:1px dashed var(--line); border-radius:10px; padding:12px;
            background:var(--paper); }
  .id-box .lbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); }
  .id-box .ref { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:26px; color:var(--indigo); margin-top:3px; }
  .id-box .hint { font-size:11px; color:var(--soft); margin-top:4px; }
  .modal button { width:100%; margin-top:10px; }
  .modal .copy { background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; padding:9px; font-size:13px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">वस्त्र</span>
      <div><h1 id="shopTitle">Rewards Shop</h1><div class="sub">Loyalty rewards</div></div>
    </div>
    <div class="wallet"><div class="label">Your points</div><div class="bal" id="bal">—</div></div>
  </div>

  <div class="wrap">
    <div class="ok" id="ok"></div>
    <div class="error" id="err"></div>
    <div class="grid" id="gifts"></div>
    <div class="links"><a onclick="go('/web')">← Home</a> &nbsp;·&nbsp; <a onclick="go('/web/claims')">My claims</a> &nbsp;·&nbsp; <a onclick="go('/web/scan')">Scan a code</a></div>
  </div>

  <div class="backdrop" id="successModal" style="display:none">
    <div class="modal">
      <div class="tick">✓</div>
      <h2>Claim Successful!</h2>
      <p>You claimed <span class="gift-name" id="mGift"></span>.</p>
      <div class="id-box">
        <div class="lbl">Your Claim ID</div>
        <div class="ref" id="mRef"></div>
        <div class="hint">Keep this as proof of your claim</div>
      </div>
      <p id="mBal"></p>
      <button class="copy" onclick="copyRef(this)">Copy Claim ID</button>
      <button onclick="go('/web/claims')">View my claims</button>
      <button class="copy" onclick="closeModal()">Done</button>
    </div>
  </div>

<script>
let token = localStorage.getItem('vl_rtoken') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n) => Number(n).toLocaleString('en-IN');
function flash(id, msg) { const e = $(id); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
function go(p) { window.location.href = p; }
function gotoLogin() { window.location.href = '/web?next=' + encodeURIComponent('/web/shop'); }

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers);
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, opts);
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) { localStorage.removeItem('vl_rtoken'); gotoLogin(); }
    throw new Error((body && body.detail) || res.statusText);
  }
  return body;
}

async function loadShop() {
  flash('err', ''); flash('ok', '');
  try {
    const shop = await api('/retailer/shop');
    $('bal').textContent = nf(shop.balance);
    $('shopTitle').textContent = shop.shop_name + ' — Rewards';
    if (shop.gifts.length === 0) { $('gifts').innerHTML = '<p class="empty">No rewards available yet.</p>'; return; }
    $('gifts').innerHTML = shop.gifts.map(g => `
      <div class="gift ${g.affordable ? '' : 'locked'}">
        <div class="badge"><span class="pts">${nf(g.points_cost)}</span><span class="lbl">POINTS</span></div>
        <div class="thumb">
          ${g.image_url
            ? `<img src="${esc(g.image_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🎁'}))" />`
            : `<div class="ph">🎁</div>`}
        </div>
        <div class="body">
          <h3 class="name">${esc(g.name)}</h3>
          <p class="desc">${g.description ? esc(g.description) : ''}</p>
          <button class="claim" ${g.affordable ? '' : 'disabled'}
            onclick="claim(${g.id}, ${JSON.stringify(g.name).replace(/"/g, '&quot;')}, ${g.points_cost})">
            ${g.affordable ? 'Claim reward' : `Need ${nf(g.points_cost - shop.balance)} more`}
          </button>
        </div>
      </div>`).join('');
  } catch (e) { flash('err', e.message); }
}

async function claim(giftId, name, cost) {
  if (!confirm(`Claim "${name}" for ${nf(cost)} points?\n\nThis is final — the points will be deducted now and the request sent to the manufacturer for approval.`)) return;
  flash('err', ''); flash('ok', '');
  try {
    const out = await api('/retailer/claim', { method: 'POST', body: JSON.stringify({ gift_id: giftId }) });
    $('mGift').textContent = out.gift;
    $('mRef').textContent = out.reference;
    $('mBal').textContent = `Sent to the manufacturer for approval. New balance: ${nf(out.new_balance)} points.`;
    $('successModal').style.display = 'flex';
    loadShop();
  } catch (e) { flash('err', e.message); }
}

function copyRef(btn) {
  const ref = $('mRef').textContent;
  navigator.clipboard?.writeText(ref).then(
    () => { const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = t; }, 1500); },
    () => {});
}
function closeModal() { $('successModal').style.display = 'none'; }

if (!token) gotoLogin(); else loadShop();
</script>
</body>
</html>
