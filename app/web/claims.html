<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Claims</title>
<meta name="theme-color" content="#0191d0" />
<style>
  :root {
    --paper:#edf3f8; --card:#ffffff; --ink:#112134; --soft:#45576b;
    --line:#d2dee9; --primary:#0191d0; --primary-deep:#0379ae;
    --indigo:#1d466f; --madder:#fb624b; --leaf:#3e6b4f; --gold:#b98a2f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:var(--paper); color:var(--ink); }
  .topbar { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:3px double var(--ink);
            padding:14px 18px; display:flex; align-items:center; gap:10px; }
  .brand-logo { height:40px; width:auto; display:block; }
  h1 { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:19px; margin:0; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 18px 50px; }
  .error { background:#fee9e5; border:1px solid var(--madder); color:#e34a33; padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .empty { color:var(--soft); font-style:italic; }
  .claim { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;
           display:flex; gap:14px; align-items:flex-start; box-shadow:0 1px 2px rgba(34,41,79,.07),0 6px 18px rgba(34,41,79,.05); }
  .thumb { width:64px; height:64px; flex:none; background:#fff; border:1px solid var(--line); border-radius:8px;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb .ph { font-size:30px; }
  .info { flex:1; min-width:0; }
  .info h3 { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700; font-size:16px; margin:0 0 3px; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:13px; color:var(--indigo); }
  .meta { font-size:12px; color:var(--soft); margin:3px 0 0; }
  .right { text-align:right; flex:none; }
  .pts { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600; font-size:14px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
           border-radius:999px; padding:2px 10px; margin-top:6px; }
  .badge.pending { background:rgba(185,138,47,.15); color:var(--gold); border:1px solid rgba(185,138,47,.4); }
  .badge.approved { background:rgba(62,107,79,.14); color:var(--leaf); border:1px solid rgba(62,107,79,.4); }
  .badge.rejected { background:#fee3de; color:var(--madder); border:1px solid rgba(251,98,75,.4); }
  .links { margin-top:18px; font-size:13px; }
  .links a { color:var(--madder); cursor:pointer; }
  .navmenu { position:relative; flex:none; margin-left:auto; }
  .menu-btn { padding:9px; background:transparent; box-shadow:none; border:1px solid var(--line);
              border-radius:9px; display:inline-flex; flex-direction:column; gap:4px; cursor:pointer; }
  .menu-btn:active { transform:none; box-shadow:none; }
  .menu-btn i { display:block; width:22px; height:2px; background:var(--indigo); border-radius:2px; transition:transform .2s,opacity .2s; }
  .menu-btn.open i:nth-child(1){ transform:translateY(6px) rotate(45deg); }
  .menu-btn.open i:nth-child(2){ opacity:0; }
  .menu-btn.open i:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
  .menu-pop { position:absolute; right:0; top:calc(100% + 8px); min-width:210px; background:var(--card);
              border:1px solid var(--line); border-radius:12px; padding:8px; z-index:60;
              box-shadow:0 16px 40px rgba(34,41,79,.22); display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { width:100%; margin:0; text-align:left; font-size:15px; font-weight:500; padding:11px 14px;
                     border:none; background:transparent; color:var(--ink); box-shadow:none; border-radius:8px; cursor:pointer; }
  .menu-pop button.active { color:var(--primary-deep); font-weight:600; background:rgba(1,145,208,.10); }
  .menu-pop button.logout { color:var(--madder); }
  .menu-pop .sep { height:1px; background:var(--line); margin:6px 8px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(17,33,52,.5); backdrop-filter:blur(3px); z-index:100;
                    display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:380px;
                 text-align:left; box-shadow:0 20px 45px rgba(34,41,79,.25); }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="topbar">
    <img class="brand-logo" src="/web/vastra-logo.png" alt="Vastra" />
    <h1>My Claims</h1>
    <div class="navmenu">
      <button class="menu-btn" id="navBtn" onclick="toggleMenu()" aria-label="Menu" aria-haspopup="menu"><i></i><i></i><i></i></button>
      <div class="menu-pop" id="navPop" role="menu">
        <button onclick="go('/web')">Home</button>
        <button onclick="go('/web/shop')">Redeem shop</button>
        <button class="active" onclick="go('/web/claims')">Claims</button>
        <div class="sep"></div>
        <button onclick="openChangePwModal()">Change password</button>
        <button class="logout" onclick="menuLogout()">Log out</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="error" id="err"></div>
    <div id="list"></div>
    <div class="links"><a onclick="go('/web')">← Home</a> &nbsp;·&nbsp; <a onclick="go('/web/shop')">Rewards shop</a></div>
  </div>

  <!-- change password modal (from burger menu) -->
  <div class="modal-backdrop hidden" id="changePwModal">
    <div class="modal-card">
      <h3 style="margin-top:0; margin-bottom:6px; font-size:18px; color:var(--ink);">Change Password</h3>
      <p style="font-size:13px; color:var(--soft); margin-top:0; margin-bottom:14px;">Update your password for your retailer account.</p>
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">Current Password</label>
      <input id="modalCurPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px;" placeholder="Current password" />
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">New Password (min 8 chars)</label>
      <input id="modalNewPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px;" placeholder="New password" />
      <label style="font-size:13px; font-weight:600; color:var(--soft); display:block; margin-bottom:4px;">Confirm New Password</label>
      <input id="modalConfirmPw" type="password" style="width:100%; padding:10px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px;" placeholder="Re-enter new password" />
      <button style="width:100%; font:inherit; font-weight:600; font-size:15px; padding:13px; margin-top:0; border:none; border-radius:9px; background:var(--primary); color:#fff; cursor:pointer;" onclick="submitModalPwChange()">Update Password</button>
      <button style="width:100%; font:inherit; font-weight:600; font-size:15px; padding:11px; margin-top:8px; border:1px solid var(--line); border-radius:9px; background:transparent; color:var(--ink); cursor:pointer;" onclick="closeChangePwModal()">Cancel</button>
      <div class="error" id="modalPwError" style="margin-top:10px; display:none;"></div>
      <div id="modalPwSuccess" style="margin-top:10px; padding:10px; background:#e6f4ea; color:#137333; border:1px solid #ceead6; border-radius:8px; font-size:13px; display:none;">Password updated successfully!</div>
    </div>
  </div>

<script>
let token = localStorage.getItem('vl_rtoken') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n) => Number(n).toLocaleString('en-IN');
function go(p) { window.location.href = p; }
function gotoLogin() { window.location.href = '/web?next=' + encodeURIComponent('/web/claims'); }

function toggleMenu() {
  $('navPop').classList.toggle('open');
  $('navBtn').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const pop = $('navPop'), btn = $('navBtn');
  if (!pop || !pop.classList.contains('open')) return;
  if (!pop.contains(e.target) && !btn.contains(e.target)) {
    pop.classList.remove('open'); btn.classList.remove('open');
  }
});
async function menuLogout() {
  try { await fetch('/auth/retailer/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch {}
  localStorage.removeItem('vl_rtoken'); sessionStorage.removeItem('vl_scan_loc');
  window.location.href = '/web';
}

function openChangePwModal() {
  $('navPop').classList.remove('open');
  $('navBtn').classList.remove('open');
  $('modalCurPw').value = '';
  $('modalNewPw').value = '';
  $('modalConfirmPw').value = '';
  $('modalPwError').style.display = 'none';
  $('modalPwSuccess').style.display = 'none';
  $('changePwModal').classList.remove('hidden');
}
function closeChangePwModal() {
  $('changePwModal').classList.add('hidden');
}
async function submitModalPwChange() {
  const errEl = $('modalPwError');
  const succEl = $('modalPwSuccess');
  errEl.style.display = 'none';
  succEl.style.display = 'none';
  const curP = $('modalCurPw').value;
  const newP = $('modalNewPw').value;
  const confP = $('modalConfirmPw').value;
  if (!curP) { errEl.textContent = 'Please enter your current password'; errEl.style.display = 'block'; return; }
  if (newP.length < 8) { errEl.textContent = 'New password must be at least 8 characters'; errEl.style.display = 'block'; return; }
  if (newP !== confP) { errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch('/retailer/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ current_password: curP, new_password: newP })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to update password');
    succEl.style.display = 'block';
    setTimeout(() => closeChangePwModal(), 1500);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function api(path) {
  const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) { localStorage.removeItem('vl_rtoken'); gotoLogin(); }
    throw new Error((body && body.detail) || res.statusText);
  }
  return body;
}

const STATUS_NOTE = {
  pending: 'Awaiting manufacturer approval',
  approved: 'Approved — collect your gift',
  rejected: 'Rejected — points refunded',
};

function fmtDate(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : ''; }

async function load() {
  try {
    const claims = await api('/retailer/claims');
    if (!claims.length) { $('list').innerHTML = '<p class="empty">No claims yet. Visit the rewards shop to redeem your points.</p>'; return; }
    $('list').innerHTML = claims.map(c => `
      <div class="claim">
        <div class="thumb">
          ${c.image_url
            ? `<img src="${esc(c.image_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🎁'}))" />`
            : `<div class="ph">🎁</div>`}
        </div>
        <div class="info">
          <h3>${esc(c.gift_name)}</h3>
          <div class="ref">${esc(c.reference)}</div>
          <p class="meta">Claimed ${fmtDate(c.created_at)}${c.decided_at ? ' · decided ' + fmtDate(c.decided_at) : ''}</p>
          <p class="meta">${STATUS_NOTE[c.status] || ''}</p>
        </div>
        <div class="right">
          <div class="pts">${nf(c.points_spent)} pts</div>
          <span class="badge ${c.status}">${c.status}</span>
        </div>
      </div>`).join('');
  } catch (e) { const el = $('err'); el.textContent = e.message; el.style.display = 'block'; }
}

if (!token) gotoLogin(); else load();
</script>
</body>
</html>
