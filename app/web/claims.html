<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Claims</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#f6f1e6; --card:#fbf8f1; --ink:#22294f; --soft:#4c5170;
    --line:#ddd2bb; --indigo:#2b3468; --madder:#c8472b; --leaf:#3e6b4f; --gold:#b98a2f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'IBM Plex Sans',sans-serif; background:var(--paper); color:var(--ink); }
  .topbar { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:3px double var(--ink);
            padding:14px 18px; display:flex; align-items:center; gap:10px; }
  .brand-mark { font-family:'Fraunces',serif; font-size:20px; color:var(--paper); background:var(--indigo);
                padding:6px 8px 8px; border-radius:3px 10px 3px 10px; box-shadow:2px 2px 0 var(--madder); }
  h1 { font-family:'Fraunces',serif; font-size:19px; margin:0; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 18px 50px; }
  .error { background:#f7e3dd; border:1px solid var(--madder); color:#a83a22; padding:10px 13px; border-radius:8px; margin-bottom:14px; font-size:14px; display:none; }
  .empty { color:var(--soft); font-style:italic; }
  .claim { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;
           display:flex; gap:14px; align-items:flex-start; box-shadow:0 1px 2px rgba(34,41,79,.07),0 6px 18px rgba(34,41,79,.05); }
  .thumb { width:64px; height:64px; flex:none; background:#fff; border:1px solid var(--line); border-radius:8px;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
  .thumb .ph { font-size:30px; }
  .info { flex:1; min-width:0; }
  .info h3 { font-family:'Fraunces',serif; font-size:16px; margin:0 0 3px; }
  .ref { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--indigo); }
  .meta { font-size:12px; color:var(--soft); margin:3px 0 0; }
  .right { text-align:right; flex:none; }
  .pts { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
           border-radius:999px; padding:2px 10px; margin-top:6px; }
  .badge.pending { background:rgba(185,138,47,.15); color:var(--gold); border:1px solid rgba(185,138,47,.4); }
  .badge.approved { background:rgba(62,107,79,.14); color:var(--leaf); border:1px solid rgba(62,107,79,.4); }
  .badge.rejected { background:#f0ddd6; color:var(--madder); border:1px solid rgba(200,71,43,.4); }
  .links { margin-top:18px; font-size:13px; }
  .links a { color:var(--madder); cursor:pointer; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand-mark">वस्त्र</span>
    <h1>My Claims</h1>
  </div>
  <div class="wrap">
    <div class="error" id="err"></div>
    <div id="list"></div>
    <div class="links"><a onclick="go('/web')">← Home</a> &nbsp;·&nbsp; <a onclick="go('/web/shop')">Rewards shop</a></div>
  </div>

<script>
let token = localStorage.getItem('vl_rtoken') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n) => Number(n).toLocaleString('en-IN');
function go(p) { window.location.href = p; }
function gotoLogin() { window.location.href = '/web?next=' + encodeURIComponent('/web/claims'); }

async function api(path) {
  const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) { localStorage.removeItem('vl_rtoken'); gotoLogin(); }
    throw new Error((body && body.detail) || res.statusText);
  }
  return body;
}

const STATUS_NOTE = {
  pending: 'Awaiting manufacturer approval',
  approved: 'Approved — collect your gift',
  rejected: 'Rejected — points refunded',
};

function fmtDate(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : ''; }

async function load() {
  try {
    const claims = await api('/retailer/claims');
    if (!claims.length) { $('list').innerHTML = '<p class="empty">No claims yet. Visit the rewards shop to redeem your points.</p>'; return; }
    $('list').innerHTML = claims.map(c => `
      <div class="claim">
        <div class="thumb">
          ${c.image_url
            ? `<img src="${esc(c.image_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🎁'}))" />`
            : `<div class="ph">🎁</div>`}
        </div>
        <div class="info">
          <h3>${esc(c.gift_name)}</h3>
          <div class="ref">${esc(c.reference)}</div>
          <p class="meta">Claimed ${fmtDate(c.created_at)}${c.decided_at ? ' · decided ' + fmtDate(c.decided_at) : ''}</p>
          <p class="meta">${STATUS_NOTE[c.status] || ''}</p>
        </div>
        <div class="right">
          <div class="pts">${nf(c.points_spent)} pts</div>
          <span class="badge ${c.status}">${c.status}</span>
        </div>
      </div>`).join('');
  } catch (e) { const el = $('err'); el.textContent = e.message; el.style.display = 'block'; }
}

if (!token) gotoLogin(); else load();
</script>
</body>
</html>
